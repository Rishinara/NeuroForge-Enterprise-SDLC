spring.application.name=neuroforge-backend
server.port=8082

# ==========================
# PostgreSQL Database
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/neuroforge_db
spring.datasource.username=postgres
spring.datasource.password=root

# ==========================
# Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# PostgreSQL Dialect
# ==========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=MySuperSecretKeyForNeuroForgeAuthenticationProject123456789
jwt.expiration=86400000


spring.ai.openai.api-key=INSERT_APIKEY
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
