version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neuroforge-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=neuroforge_db
    volumes:
      - neuroforge-db-data:/var/lib/postgresql/data

volumes:
  neuroforge-db-data: