# ===================================================================
# COMMON PROPERTIES (Active across all profiles)
# ===================================================================
spring.application.name=neuroforge-backend
server.port=${PORT:8082}

# Import local .env configuration file from classpath resources as a properties format
spring.config.import=optional:classpath:.env[.properties]

# Default Active Profile
spring.profiles.active=dev

# -------------------------------------------------------------------
# App-Specific & Security Properties
# -------------------------------------------------------------------
app.frontend.base-url=http://localhost:5173
app.mail.from-email=${MAIL_FROM_EMAIL:vmowneesh8@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Mowneesh v}

# Password Reset Token Expiration: 15 minutes (in milliseconds)
app.auth.password-reset-token-expiration-ms=900000

# -------------------------------------------------------------------
# Database & Connection Pool (HikariCP)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# JPA & Hibernate
# -------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
# Access Token: 15 minutes | Refresh Token: 7 days
jwt.expiration=900000
jwt.refresh.expiration=604800000

# -------------------------------------------------------------------
# API Documentation (SpringDoc / Swagger UI)
# -------------------------------------------------------------------
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# Logging & Actuator Health
# -------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.neuroforge=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never